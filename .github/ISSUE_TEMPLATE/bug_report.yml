name: Bug Report
description: Report a bug to help us improve. Fill in the relevant details so we can reproduce and fix it.
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below — the more detail you provide, the faster we can reproduce and fix it.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched the existing issues and there is no duplicate
          required: true
        - label: I have reproduced the bug on the latest `main` branch
          required: true

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear, concise description of what is broken.
      placeholder: "When I click the save button on the movie card, nothing happens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Paste error messages, console output, or stack traces.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much does this impact the user?
      options:
        - Critical (app crashes, blocks core flow)
        - High (feature broken, no workaround)
        - Medium (feature broken, has workaround)
        - Low (cosmetic, minor inconvenience)
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected URL / Route
      description: Which page or route is affected?
      placeholder: "/explore?genre=28"
    validations:
      required: false

  - type: input
    id: component
    attributes:
      label: Component / Module
      description: Which component or module is affected, if you know?
      placeholder: "MovieCard, useLibrary, httpClient, etc."
    validations:
      required: false

  - type: dropdown
    id: browsers
    attributes:
      label: Browsers
      description: Which browsers did you see this in?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Chrome (Android)
        - Other

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide versions of the relevant tooling.
      placeholder: |
        - OS: Ubuntu 24.04
        - Node: 22.10.0
        - pnpm: 11.22.0
        - Browser: Chrome 128
        - Commit / branch: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: Drag images or videos here to help explain the issue.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console / Network Logs
      description: Paste any relevant console errors or network responses. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Anything else that might help us understand the bug — workarounds, related issues, links to documentation.
    validations:
      required: false
