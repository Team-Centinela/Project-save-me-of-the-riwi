version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "chore"
      - "deps"
      - "backlog"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      major-and-security:
        applies-to: version-updates
        update-types:
          - "major"
    open-pull-requests-limit: 5
    versioning-strategy: increase
